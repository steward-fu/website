<h3><a href="../umpc.htm">微電腦</a> - SHARP Brain PW-A7300 - Brainux - <b>調整預設背光亮度</b></h3>
<hr size="1"><br>
<p>
參考資訊：<br>
https://brainux.org/<br><br>
</p>
<pre>
$ vim arch/arm/boot/dts/imx28-pwa7200.dts
    &amp;backlight_display {
        default-brightness-level = &lt;5&gt;;
        status = "okay";
    };
</pre>
<p>
P.S. 編譯後的imx28-pwa7200.dtb覆蓋到MicroSD imx28-pwg5300.dtb
</p>
