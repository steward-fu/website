<h3><a href="../umpc.htm">微電腦</a> - Zipit Z2 - <b>安裝z2uFlashstock</b></h3>
<hr size="1"><br>
<p>
1. 下載https://mozzwald.com/zipit/u-boot/z2uFlashstock-v0.3.1_jffs_20170609.zip<br>
2. 準備一張1GB MiniSD並格式化成FAT16<br>
3. 將z2uFlashstock-v0.3.1_jffs_20170609.zip解壓縮到MiniSD根目錄<br>
4. 插入MiniSD並開機<br>
