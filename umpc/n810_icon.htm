<h3><a href="../umpc.htm">微電腦</a> - Nokia N810 - <b>更改選單Icon</b></h3>
<hr size="1"><br>
<p>
1. 切換到Icon目錄
</p>
<pre>
$ cd /usr/share/icons/hicolor/
</pre>
<p>
2. 修改自定義的Icon<br>
3. 更新Icon Database
</p>
<pre>
$ sudo gtk-update-icon-cache -f /usr/share/icons/hicolor/
$ sudo reboot
</pre>
