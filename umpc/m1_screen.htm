<h3><a href="../umpc.htm">微電腦</a> - Mbook M1 - <b>螢幕仰角</b></h3>
<hr size="1"><br>
<p>
由於Mbook M1電腦螢幕仰角的角度大約只有100度左右，如果放在桌上使用時，這樣的角度就相當適闔眼睛觀看的角度，但是，當拿在手上操作時，這樣的仰角就太小了，為了要有比較好的觀看視覺，司徒常常需要把Mbook M1電腦舉到跟眼睛幾乎一樣的水平高度，這樣的使用方式相當不方便，因此，司徒只好自己動手修改，讓Mbook M1電腦具有180度的大仰角<br><br>
