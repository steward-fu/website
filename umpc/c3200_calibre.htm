<h3><a href="../umpc.htm">微電腦</a> - SHARP Zaurus SL-C3200 - <b>如何校準電池</b></h3>
<hr size="1"><br>
<p>
替換或者改造電池後，必須做電池校準，否則電池會充不飽，電池校準步驟如下：<br>
1. 進入Service Menu(D + M + Fn)<br>
2. 選擇<b>10. Charge</b>並且接上電源線<br>
<img src="c3200_calibre/1.jpg" class="maxSize"><br><br>

3. 開啟充電模式並且確定充飽電(一般是充一整個晚上)<br>
<img src="c3200_calibre/2.jpg" class="maxSize"><br><br>

4. 選擇<b>6. Batt Voltage Adjust</b><br> 
<img src="c3200_calibre/3.jpg" class="maxSize"><br><br>

5. 選擇<b>1. Battery Voltage Adj</b><br>
<img src="c3200_calibre/4.jpg" class="maxSize"><br><br>

6. 按下Home按鍵儲存即可<br>
<img src="c3200_calibre/5.jpg" class="maxSize">
</p>
