<h3><a href="../umpc.htm">微電腦</a> - ASUS C100P - Debian 10 - <b>解決A start job is running for synchronize boot up for ifupdown問題</b></h3>
<hr size="1"><br>
<p>
參考資訊：<br>
https://bugs.debian.org/cgi-bin/bugreport.cgi?bug=959985<br><br>

解法如下：
</p>
<pre>
$ sudo systemctl mask ifupdown-pre.service
</pre>
