<h3><a href="../phone.htm">手機</a> - Motorola XT897 - Sailfish OS 4.4.0.68 - <b>解決Libreoffice Unspecified Application Error問題</b></h3>
<hr size="1"><br>
<p>
參考資訊：<br>
https://askubuntu.com/questions/1428078/libreoffice-not-starting-on-ubuntu-studio-22-04<br><br>

問題如下：
</p>
<pre>
$ libreoffice
    Unspecified Application Error
</pre><br>

<p>
解法如下：
</p>
<pre>
$ sudo apt install libreoffice-gtk3
</pre>
