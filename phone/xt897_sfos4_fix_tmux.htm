<h3><a href="../phone.htm">手機</a> - Motorola XT897 - Sailfish OS 4.4.0.68 - <b>解決vim在tmux沒有選擇行的顏色問題</b></h3>
<hr size="1"><br>
<p>
參考資訊：<br>
https://stackoverflow.com/questions/10158508/lose-vim-colorscheme-in-tmux-mode<br><br>
</p>
<pre>
$ vim ~/.bashrc
    alias tmux="TERM=screen-256color-bce tmux"

$ vim ~/.tmux.conf
    set -g default-terminal "xterm"
</pre>
