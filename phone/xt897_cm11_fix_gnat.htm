<h3><a href="../phone.htm">手機</a> - Motorola XT897 - CM 11 - Debian - <b>解決configure: error: GNAT is required to build ada問題</b></h3>
<hr size="1"><br>
<p>
問題如下：
</p>
<pre>
configure: error: GNAT is required to build ada
</pre><br>

<p>
解法如下：
</p>
<pre>
代表目前GCC沒有支援ADA語言，一般是手動編譯時，沒有加上ADA語言選項，解法是退回有支援ADA的GCC版本，如：官方GCC版本
</pre>
