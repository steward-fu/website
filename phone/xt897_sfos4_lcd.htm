<h3><a href="../phone.htm">手機</a> - Motorola XT897 - Sailfish OS 4.4.0.68 - <b>如何關閉屏幕逾時設定</b></h3>
<hr size="1"><br>
<p>
參考資訊：<br>
https://forum.sailfishos.org/t/custom-display-sleep-timeout-new-feature-request/8714<br><br>

For display always on, type in terminal
</p>
<pre>
$ mcetool --set-demo-mode=on
</pre><br>

<p>
For default settings, type in terminal
</p>
<pre>
$ mcetool --set-demo-mode=off
</pre>
