<h3><a href="../phone.htm">手機</a> - Motorola XT897 - Sailfish OS 4.4.0.68 - <b>Build libXv</b></h3>
<hr size="1"><br>
<p>
參考資訊：<br>
https://packages.debian.org/zh-cn/sid/libxv-dev<br><br>
</p>
<pre>
$ cd
$ wget http://deb.debian.org/debian/pool/main/libx/libxv/libxv_1.0.11.orig.tar.gz
$ tar xvf libxv_1.0.11.orig.tar.gz
$ cd libXv-1.0.11
$ ./configure
$ make
$ sudo make install
</pre>
