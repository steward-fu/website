<h3><a href="../phone.htm">手機</a> - Astro Slide 5G - Android - <b>如何備份全部磁區的資料</b></h3>
<hr size="1"><br>
<p>
執行如下命令後，再將Astro Slide 5G連接到PC<br>
</p>
<pre>
$ cd
$ git clone https://github.com/bkerler/mtkclient
$ cd mtkclient
$ ./mtk rl backup
</pre>
