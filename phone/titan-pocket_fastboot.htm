<h3><a href="../phone.htm">手機</a> - Unihertz Titan Pocket (TEE) - <b>如何進入fastboot模式</b></h3>
<hr size="1"><br>
<p>
參考資訊：<br>
https://github.com/rumplestilzken/twrp_device_unihertz_gargoyle<br><br>

步驟如下：<br>
1. <b>Power + Vol-UP</b><br>
2. 看到<b>No command</b>畫面<br>
<img src="titan-pocket_fastboot/1.jpg" class="maxSize"><br><br>

3. 按下多次<b>Power + Vol-UP</b><br>
4. 選擇<b>Reboot to bootLoader</b>後，再按下Power進入fastboot模式<br>
<img src="titan-pocket_fastboot/2.jpg" class="maxSize">
</p>
