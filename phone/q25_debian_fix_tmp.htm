<h3><a href="../phone.htm">手機</a> - Zinwa Q25 - Debian - <b>解決Cannot open display問題</b></h3>
<hr size="1"><br>
<p>
問題如下：
</p>
<pre>
$ DISPLAY=:0 dbus-launch --exit-with-session xfce4-session
    xfce4-session: Cannot open display: .
    Type 'xfce4-session --help' for usage.
</pre><br>

<p>
解法如下：
</p>
<pre>
將/data/data/com.termux/files/usr/tmp Bind到chroot系統的/tmp即可，因為X11的socket是在外層產生的
</pre>
