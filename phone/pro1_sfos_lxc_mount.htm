<h3><a href="../phone.htm">手機</a> - F(x)tec Pro1 - Sailfish OS - LXC - <b>如何添加Mount</b></h3>
<hr size="1"><br>
<pre>
$ sudo vim /var/lib/lxc/xxx/config
    lxc.cap.drop =
    lxc.cgroup.devices.allow = a
    lxc.mount.entry = /dev/net dev/net none rbind,create=dir 0 0
</pre>
<p>
P.S. xxx是Container Name
</p>
