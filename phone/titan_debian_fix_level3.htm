<h3><a href="../phone.htm">手機</a> - Unihertz Titan (TEE-EMMC) - Debian - <b>解決xmodmap無法使用ISO_Level3_Shift問題</b></h3>
<hr size="1"><br>
<pre>
$ setxkbmap "us(intl)"
$ setxkbmap -option ""
</pre>
<p>
P.S. 對應的文件需要修改外面的<b>/data/data/x.org.server/files/usr/share/X11/xkb/symbols/us</b>
</p>
