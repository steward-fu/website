<h3><a href="../phone.htm">手機</a> - Nokia N900 - <b>Mugen Power 3.7V 2400mA電池</b></h3>
<hr size="1"><br>
<p>
Mugen 3.7V 2400mA電池<br>
<img src="n900_mugen/1.jpg" class="maxSize"><br><br>

加上厚蓋後，體積更胖並且沒有相機保護蓋<br>
<img src="n900_mugen/2.jpg" class="maxSize"><br><br>

握起來的手感還算是可以<br>
<img src="n900_mugen/3.jpg" class="maxSize"><br><br>

原廠厚度 V.S. Mugen厚度<br>
<img src="n900_mugen/4.jpg" class="maxSize"><br><br>

原廠還是比較有質感，加上Mugen使用防滑材質，讓手感變得比較差一些<br>
<img src="n900_mugen/5.jpg" class="maxSize"><br><br>

另一面比較<br>
<img src="n900_mugen/6.jpg" class="maxSize"><br><br>

背蓋比較<br>
<img src="n900_mugen/7.jpg" class="maxSize"><br><br>

從光澤就可以看出質感不一樣<br>
<img src="n900_mugen/8.jpg" class="maxSize"><br><br>

Mugen電池大約是原廠的兩倍厚，因此，建議使用者購買厚電池蓋，然後在自行使用原廠電池改裝即可<br>
<img src="n900_mugen/9.jpg" class="maxSize">
