<h3><a href="../system.htm">系統</a> - Debian - QEMU - <b>如何設定Windows 2000 VGA顯示卡</b></h3>
<hr size="1"><br>
<p>
參考資訊：<br>
https://archive.org/details/vmware-svga-2-win2000<br>
https://www.pierov.org/2022/04/28/windows-2000-in-2022/<br><br>

QEMU(-vga vmware)
</p>
<pre>
$ qemu-system-i386 -m 256 -vga vmware -accel tcg -display gtk -hda win2k.qcow2 -boot c
</pre>
