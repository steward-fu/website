<h3><a href="../program.htm">程式語言</a> - ObjAsm - <b>如何使用Linux UASM + MinGW編譯應用程式</b></h3>
<hr size="1"><br>
<pre>
$ uasm \
    -coff \
    -c \
    -q \
    -less \
    -nomlib \
    -FwNUL \
    -Zi \
    -Zd \
    app.asm

$ i686-w64-mingw32-ld \
    app.o \
    -o app.exe \
    -lgdi32 \
    -luser32 \
    -ladvapi32 \
    -lkernel32 \
    -e _start@0
</pre>
