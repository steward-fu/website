<hr size="1"><br>
<p>
參考資訊：<br>
https://github.com/eeTools/SimulIDE-dev<br><br>
</p>
<pre>
$ sudo apt-get install qttools5-dev-tools qtbase5-dev qtmultimedia5-dev qt5-*-dev

$ cd
$ git clone https://github.com/eeTools/SimulIDE-dev
$ cd SimulIDE-dev/build_XX
$ qmake
$ make
$ sudo make install
