<p>
參考資訊：<br>
https://github.com/dibyendumajumdar/nanojit<br><br>
</p>
<pre>
$ cd
$ git clone https://github.com/dibyendumajumdar/nanojit
$ mkdir nanojit/build
$ cd nanojit/build
$ cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release ..
$ make -j4
$ sudo make install
