<h3><a href="../program.htm">程式語言</a> - Wine - <b>解決wine: Bad EXE format for Z:\問題</b></h3>
<hr size="1"><br>
<p>
問題如下：
</p>
<pre>
$ wine main.exe
    wine: Bad EXE format for Z:\home\user\Downloads\main.exe
</pre><br>

<p>
解法如下：
</p>
<pre>
$ wine main.exe.so
</pre>
