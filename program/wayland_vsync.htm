<h3><a href="../program.htm">程式語言</a> - Wayland - <b>如何關閉EGL VSYNC</b></h3>
<hr size="1"><br>
<p>
參考資訊：<br>
https://registry.khronos.org/EGL/sdk/docs/man/html/eglSwapInterval.xhtml<br><br>
</p>
<pre class="brush:cpp">
eglSwapInterval(disp, 0);
</pre>
<p>
P.S. 0=關閉VSYNC，1=開啟VSYNC
</p>
