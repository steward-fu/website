<p>
題目：<br>
<img src="leetcode_c_2579/1.jpg" class="maxSize"><br><br>

解答：
</p>
<pre class="brush:cpp">
long long coloredCells(int n)
{
    int i = 0;
    long long cc = 1;

    for (i = 0; i &lt; n; i++) {
        cc += (i * 4);
    }
    return cc;
}
