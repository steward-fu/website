<h3><a href="../driver.htm">驅動程式</a> - Kernel Mode Driver Framework (KMDF) - <b>解決Failed to connect to OM問題</b></h3>
<hr size="1"><br>
<p>
問題：
</p>
<pre>
Failed to connect to database. Failed to connect to OM
</pre>
<p>
<img src="kmdf_fix_whql_database/1.jpg" class="maxSize"><br><br>

原因：
</p>
<pre>
安裝完HLK/HCK後，不能更改PC Name，否則會導致HLK/HCK找不到Database
</pre><br>

<p>
解法：
</p>
<pre>
重新安裝系統以及HLK/HCK
</pre>
