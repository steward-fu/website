<h3><a href="../driver.htm">驅動程式</a> - Linux Device Driver(LDD) - Falco - <b>Build pdig</b></h3>
<hr size="1"><br>
<p>
參考資訊：<br>
https://falco.org/blog/choosing-a-driver/<br><br>

步驟如下：
</p>
<pre>
$ cd
$ git clone https://github.com/falcosecurity/pdig
$ git clone -b gen-events-falco-engine https://github.com/falcosecurity/libs
$ cd pdig
$ mkdir -p build
$ cd build
$ cmake ..
$ make
</pre>
