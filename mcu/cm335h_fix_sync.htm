<h3><a href="../mcu.htm">微處理器</a> - TI AM3352 (CM3352H) - <b>解決Frame Synchronization Lost Enabled Interrupt問題</b></h3>
<hr size="1"><br>
<p>
問題在於LCD設定成Palette模式，但是在提供的DMA Buffer前32Bytes(第一個Byte是0x40，其餘是0x00)並不符合如下格式：<br>
<img src="cm335h_fix_sync/1.jpg" class="maxSize"><br>
只要關閉Palette模式或者額外多配置32 Bytes(Palatte資料)即可
</p>
