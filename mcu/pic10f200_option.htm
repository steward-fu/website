<h3><a href="../mcu.htm">微處理器</a> - Microchip PIC10F200 - <b>如何修改OPTION暫存器</b></h3>
<hr size="1"><br>
<p>
PIC10F200沒有OPTION實際暫存器，只能透過OPTION指令修改
</p>
<pre>
movlw b'11000000'
option
</pre>
