<h3><a href="../mcu.htm">微處理器</a> - Lattice iCE40LP iCE40LP1K (iCESugar-nano) - Verilog - <b>Button</b></h3>
<hr size="1"><br>
<p>
main.v
</p>
<pre class="brush:verilog">
module main (
    input btn,
    output reg led
);
  
initial begin
    led = 0;
end
    
always @(posedge btn) begin
    led &lt;= ~led;
end
   
endmodule
</pre><br>

<p>
main.pcf
</p>
<pre>
set_io led B6
set_io btn E3
</pre><br>
