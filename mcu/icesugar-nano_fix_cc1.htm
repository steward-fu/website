<h3><a href="../mcu.htm">微處理器</a> - Lattice iCE40LP iCE40LP1K (iCESugar-nano) - <b>解決手機無法供電問題</b></h3>
<hr size="1"><br>
<p>
由於CC1、CC2並沒有下拉5.1K電阻，導致手機無法正確供電<br>
<img src="icesugar-nano_fix_cc1/1.jpg" class="maxSize"><br><br>

解法只要CC1、CC2下拉一顆5.1K電阻即可<br>
<img src="icesugar-nano_fix_cc1/2.jpg" class="maxSize"><br>
P.S. 如果只有焊接其中一個CC，如：CC1，則插入USB到手機將會有方向性
</p>
