<h3><a href="../mcu.htm">微處理器</a> - Gowin GW1NSR-LV4CQN48PC6/I5 (Lichee Tang Nano 4K) - Gowin IDE - Verilog - <b>Button</b></h3>
<hr size="1"><br>
<p>
main.v
</p>
<pre class="brush:verilog">
module main (
    input btn,
    output reg led
);

initial begin
    led = 0;
end
  
always @(posedge btn) begin
    led &lt;= ~led;
end
 
endmodule
</pre><br>

<p>
main.cst
</p>
<pre>
IO_LOC "led" 10;
IO_LOC "btn" 14;
</pre><br>
