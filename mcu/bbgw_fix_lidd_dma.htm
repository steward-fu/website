<h3><a href="../mcu.htm">微處理器</a> - TI AM3358 (SeeedStudio BeagleBone Green Wireless) - <b>解決LIDD DMA在中斷後無法啟動的問題</b></h3>
<hr size="1"><br>
<p>
Disable後，再度Enable
</p>
<pre>
iowrite32(0x00000003, LIDD_CTRL); // 8080 Interface, Disable DMA
iowrite32(0x00000103, LIDD_CTRL); // 8080 Interface, Enable DMA
</pre>
