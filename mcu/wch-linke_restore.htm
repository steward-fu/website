<h3><a href="../mcu.htm">微處理器</a> - WCH CH32V305 (WCH-LinkE) - <b>如何透過WCH-LinkUtility回復韌體</b></h3>
<hr size="1"><br>
<p>
參考資訊：<br>
https://www.wch.cn/downloads/WCH-LinkSCH_PDF.html<br>
https://www.wch.cn/downloads/wch-linkutility_zip.html<br><br>

步驟如下：<br>
1. 按住IAP按鍵並且插入USB<br>
2. USB裝置<br>
<img src="wch-linke_restore/1.jpg" class="maxSize"><br><br>

3. 選擇連接<br>
<img src="wch-linke_restore/2.jpg" class="maxSize"><br><br>

4. 按下Yes開始回復韌體<br>
<img src="wch-linke_restore/3.jpg" class="maxSize"><br><br>

5. 完成<br>
<img src="wch-linke_restore/4.jpg" class="maxSize">
</p>
