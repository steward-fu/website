<h3><a href="../mcu.htm">微處理器</a> - STMicroelectronics STM32F103 - <b>如何透過UART燒錄程式(Flash Loader)</b></h3>
<hr size="1"><br>
<p>
1. 連接UART接腳，BOOT0接到1的位置<br>
<img src="stm32f103_uart_flash/1.jpg" class="maxSize"><br>
2. 按下RESET按鍵<br>
3. 執行Flash Loader Demonstrator<br>
<img src="stm32f103_uart_flash/2.jpg" class="maxSize"><br><br>

Next<br>
<img src="stm32f103_uart_flash/3.jpg" class="maxSize"><br><br>

Next<br>
<img src="stm32f103_uart_flash/4.jpg" class="maxSize"><br><br>

Next(<b>Jump to the user program</b>記得勾選)<br>
<img src="stm32f103_uart_flash/5.jpg" class="maxSize"><br><br>

Close<br>
<img src="stm32f103_uart_flash/6.jpg" class="maxSize"><br><br>

完成<br>
<img src="stm32f103_uart_flash/7.jpg" class="maxSize">
</p>
