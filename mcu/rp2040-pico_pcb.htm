<h3><a href="../mcu.htm">微處理器</a> - Raspberry Pi RP2040 (Pico) - <b>開發板</b></h3>
<hr size="1"><br>
<p>
RP2040支援拖曳檔案燒錄，只要把檔案(.uf2)放到RP2隨身碟即可，因此，不需要額外燒錄工具就可以開始開發，按下BOOTSEL開機就可以進入隨身碟模式，不過，目前板上的按鍵並沒有連接到GPIO，因此，司徒焊接按鍵到GPIO15<br>
