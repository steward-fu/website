<h3><a href="../mcu.htm">微處理器</a> - Nuvoton NUC977 - Assembly - <b>開發環境</b></h3>
<hr size="1"><br>
<p>
編譯NuWriter
</p>
<pre>
$ cd
$ git clone https://github.com/OpenNuvoton/NUC970_NuWriter_CMD nuwriter
$ cd nuwriter
$ ./configure
$ make
$ sudo make install
</pre><br>

<p>
安裝GNU編譯器
</p>
<pre>
$ sudo apt-get install gcc-arm-none-eabi binutils-arm-none-eabi -y
</pre>
