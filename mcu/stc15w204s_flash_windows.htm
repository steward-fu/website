<h3><a href="../mcu.htm">微處理器</a> - STCmicro STC15W204S - <b>使用Windows STC-ISP燒録程式</b></h3>
<hr size="1"><br>
<p>
連接UART的GND、TX、RX(+5V先不要接)<br>
<img src="stc15w204s_flash_windows/7.jpg" class="maxSize"><br><br>

開啟後，選擇目標MCU型號<br>
<img src="stc15w204s_flash_windows/1.jpg" class="maxSize"><br><br>

確定COM Port名稱並開啟Hex檔案<br>
<img src="stc15w204s_flash_windows/2.jpg" class="maxSize"><br><br>

選擇Hex檔案<br>
<img src="stc15w204s_flash_windows/3.jpg" class="maxSize"><br><br>

按下燒錄按鈕後，再接上+5V<br>
<img src="stc15w204s_flash_windows/4.jpg" class="maxSize"><br><br>

開使偵測目標<br>
<img src="stc15w204s_flash_windows/5.jpg" class="maxSize"><br><br>

燒錄完成<br>
<img src="stc15w204s_flash_windows/6.jpg" class="maxSize"><br><br>

完成<br>
<img src="stc15w204s_flash_windows/8.jpg" class="maxSize">
