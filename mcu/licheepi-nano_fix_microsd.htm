<h3><a href="../mcu.htm">微處理器</a> - Allwinner F1C100S (荔枝派Nano) - <b>為何程式無法從MicroSD啟動</b></h3>
<hr size="1"><br>
<pre>
寫到MicroSD的程式，必須大於等於1024 Bytes，如果程式小於等於512 Bytes，則會從SPI Flash啟動，這個限制只有發生在MicroSD，SPI Flash沒有這個限制
</pre>
