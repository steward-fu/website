<h3><a href="../mcu.htm">微處理器</a> - Allwinner H3 (NanoPi M1) - Assembly - <b>開發環境</b></h3>
<hr size="1"><br>
<p>
司徒的開發環境是Debian x64，使用的編譯工具是GNU GCC，燒錄工具則是使用sunxi-tools，安裝步驟如下：
</p>
<pre>
$ sudo apt-get install gcc-arm* -y

$ cd
$ wget https://github.com/steward-fu/website/releases/download/lichee-nano/sunxi-tools.7z
$ 7zr x sunxi-tools.7z
$ cd sunxi-tools
$ make
</pre>
