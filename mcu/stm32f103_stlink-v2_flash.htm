<h3><a href="../mcu.htm">微處理器</a> - STMicroelectronics STM32F103 - <b>如何透過ST-LINK V2燒錄程式(OpenOCD)</b></h3>
<hr size="1"><br>
<p>
連接如下四條線：<br>
<img src="stm32f103_stlink-v2_flash/1.jpg" class="maxSize"><br><br>

燒錄命令如下：
</p>
<pre>
$ sudo openocd -f /usr/local/share/openocd/scripts/interface/stlink.cfg -f /usr/local/share/openocd/scripts/target/stm32f1x.cfg -c "program main.bin reset exit 0x8000000"
</pre><br>

<p>
完成<br>
<img src="stm32f103_stlink-v2_flash/2.jpg" class="maxSize">
</p>
