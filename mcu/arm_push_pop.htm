<h3><a href="../mcu.htm">微處理器</a> - ARM - <b>push、pop、stmfd、ldmfd</b></h3>
<hr size="1"><br>
<p>
程式：
</p>
<pre class="brush:asm">
    .global _start

    .arm
    .text
_start:
    bl t1
    bl t2

t1:
    stmfd sp!, {r0-r4, lr}
    ldmfd sp!, {r0-r4, lr}

t2:
    push {r0-r4, lr}
    pop {r0-r4, lr}
</pre><br>
