<h3><a href="../index.htm">掌機</a> - RGB10 - <b>肺總的鐵殼(外型)</b></h3>
<hr size="1"><br>
<p>
感謝肺總贈送司徒一台RGB10薄的鐵殼機器，肺總的鐵殼有分多種顏色，當中還有粉色、綠色、藍色，且厚度還有分薄的跟厚的，主要差別在於USB-A以及電池的差別，司徒最終選擇薄的RGB10鐵殼，薄的尺寸為：14.4cm x 6.5cm x 1.4cm<br>
