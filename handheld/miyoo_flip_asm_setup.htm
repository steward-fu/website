<h3><a href="../index.htm">掌機</a> - Miyoo Flip - Assembly - <b>開發環境</b></h3>
<hr size="1"><br>
<p>
司徒目前使用GNU GCC編譯器，燒錄工具則是使用xrock，安裝方式如下：
</p>
<pre>
$ sudo apt-get install gcc-aarch64* -y

$ cd
$ git clone https://github.com/xboot/xrock
$ cd xrock
$ make -j4
$ sudo make install
</pre><br>
