<h3><a href="../index.htm">掌機</a> - Anbernic RetroGame - <b>為何總是Segmentation fault在SDL_MUSTLOCK</b></h3>
<hr size="1"><br>
<p>
由於Kernel缺少Mouse支援，因此，為了可以讓SDL程式順利執行，需要做SDL_NOMOUSE設定
</p>
<pre>
$ export SDL_NOMOUSE=1
</pre>
