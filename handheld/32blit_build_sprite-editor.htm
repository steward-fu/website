<h3><a href="../index.htm">掌機</a> - 32blit - <b>Build sprite-editor</b></h3>
<hr size="1"><br>
<p>
參考資料：<br>
https://github.com/32blit/sprite-editor<br><br>
</p>
<pre>
$ cd
$ git clone https://github.com/32blit/sprite-editor
$ cd sprite-editor
$ mkdir build
$ cd build
$ cmake ..
$ make -j8
$ ./sprite-editor
</pre>
