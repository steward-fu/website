<p>
TVOut支援：NTSC、PAL
</p>
<pre>
$ echo 1 &gt; /proc/jz/tvout

# PAL
$ echo 1 &gt; /proc/jz/tvselect

# NTSC
$ echo 2 &gt; /proc/jz/tvselect
