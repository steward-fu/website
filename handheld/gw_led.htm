<h3><a href="../index.htm">掌機</a> - Game &amp; Watch: Super Mario Bros. - <b>焊接LED</b></h3>
<hr size="1"><br>
<p>
由於司徒不小心把Flash裡面的程式抹掉，因此，司徒心想，乾脆就把這台掌機，當作一台單晶片開發機使用，看看是否有機會開發一些好玩的東西，而作為一台標準開發機來說，LED以及按鍵是標準的輸出入東西，因此，司徒把SPI4_CS(PE11)拉出來，當作LED輸出腳位，這樣至少一個簡單的LED程式就可以開始寫了，當然，LED也是一個很棒的Debug輸出指示狀態，腳位如下：<br>
