<h3><a href="../index.htm">掌機</a> - GPD Win2 - Debian 9.0 - <b>Build ppsspp</b></h3>
<hr size="1"><br>
<pre>
$ sudo apt-get install cmake libsdl2-dev

$ cd
$ git clone https://github.com/hrydgard/ppsspp
$ cd ppsspp
$ git submodule update --init --recursive
$ ./b.sh
$ ./build/PPSSPPSDL
</pre>
<p>
<img src="gpdwin2_debian_build_ppsspp/1.jpg" class="maxSize"><br><br>

如要支援Vulkan，請安裝如下套件：
</p>
<pre>
$ sudo apt-get install mesa-vulkan-drivers
</pre>
