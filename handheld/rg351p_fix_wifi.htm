<h3><a href="../index.htm">掌機</a> - Anbernic RG351P - <b>修正Wi-Fi雜音問題</b></h3>
<hr size="1"><br>
<p>
依據小黃的指示，在右邊喇叭(雜音只從這個喇叭出來)的負端加上一個對地0.1uF電容即可，雖然不見得對每台機器都有效，至少司徒的機器是修復了<br>
