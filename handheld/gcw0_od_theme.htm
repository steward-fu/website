<h3><a href="../index.htm">掌機</a> - GCW Zero - OpenDingux - <b>如何更改GCW0(GCW主題)成中文主題</b></h3>
<hr size="1"><br>
<p>
1. 複製(PixelManiaConden.ttf PixelManiaWide.ttf)到資料夾<b>/media/data/local/home/.gmenu2x/skins/GCW/fonts</b><br>
2. 修改字體(/media/data/local/home/.gmenu2x/skins/GCW/skin.conf)
</p>
<pre>
font="skin:fonts/PixelManiaConden.ttf"
</pre><br>

<p>
完成<br>
<img src="gcw0_od_theme/1.jpg" class="maxSize">
</p>
