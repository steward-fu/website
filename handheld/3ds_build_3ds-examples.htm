<h3><a href="../index.htm">掌機</a> - Nintendo 3DS - <b>Build 3ds-examples</b></h3>
<hr size="1"><br>
<p>
參考資訊：<br>
https://github.com/devkitPro<br><br>
</p>
<pre>
$ export DEVKITPRO=/opt/devkitpro/
$ export DEVKITARM=/opt/devkitpro/devkitARM/

$ cd
$ git clone https://github.com/devkitPro/3ds-examples
$ cd 3ds-examples
$ make
</pre>
<p>
P.S. 編譯3ds-examples前，必須先確保相關Library都已經編譯安裝完成
</p>
