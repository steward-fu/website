<hr size="1"><br>
<p>
Debian x64系統：<br>
1. 按住Select鍵並連接USB至PC<br>
2. 執行如下命令
</p>
<pre>
$ ingenic-boot \
    --mbr=mbr.bin \
    --boot=ubiboot-v20_mddr_512mb.bin \
    --system=system.bin \
    --data=data.bin
</pre>
