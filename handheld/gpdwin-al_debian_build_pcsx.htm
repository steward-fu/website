<h3><a href="../index.htm">掌機</a> - GPD Win 上蓋鋁合金版 - Debian 9.0 - <b>Build pcsx_rearmed</b></h3>
<hr size="1"><br>
<pre>
$ cd
$ git clone https://github.com/notaz/pcsx_rearmed.git
$ cd pcsx_rearmed
$ git submodule update --init --recursive
$ ./configure
$ make -j4
$ ./pcsx
</pre><br>
