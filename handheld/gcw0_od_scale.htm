<h3><a href="../index.htm">掌機</a> - GCW Zero - OpenDingux - <b>如何設定非320x240解析度</b></h3>
<hr size="1"><br>
<p>
首先更新OS到20140820(gcw0-update-2014-08-20.opk)，接著可以使用如下兩種方式設定非320x240解析度<br><br>

方法1. 修改模擬器屬性檔案(gcw0.desktop)
</p>
<pre>
X-OD-NeedsDownscaling=true
</pre><br>

<p>
方法2. 使用命令修改
</p>
<pre>
# echo 1 &gt; /sys/devices/platform/jz-lcd.0/allow_downscaling
</pre>
