<h3><a href="../index.htm">掌機</a> - GPD Win - Debian 11.0 - <b>解決No rule to make target debian/certs/benh@debian.org.cert.pem問題</b></h3>
<hr size="1"><br>
<p>
參考資訊：<br>
https://unix.stackexchange.com/questions/293642/attempting-to-compile-kernel-yields-a-certification-error/649484#649484<br><br>

解法是修改.config裡面的字串成如下：
</p>
<pre>
CONFIG_SYSTEM_TRUSTED_KEYS=""
</pre>
