<h3><a href="../index.htm">掌機</a> - M22Pro - <b>Run from SDCard</b></h3>
<hr size="1"><br>
<p>
1. Format as FAT32<br>
2. Put tomato in root
</p>
<pre>
#!/bin/sh
HOME=/mnt/SDCARD/
LOG=$HOME/debug_log.txt

cd $HOME

echo "" &gt; $LOG
while [ 1 ];
do
    echo "run from sdcard" &gt;&gt; $LOG
    sleep 1
done

sync
