<h3><a href="../index.htm">掌機</a> - GPD Win 上蓋鋁合金版 - Debian 9.0 - <b>Build ppsspp</b></h3>
<hr size="1"><br>
<pre>
$ sudo apt-get install cmake libsdl2-dev

$ cd
$ git clone https://github.com/hrydgard/ppsspp
$ cd ppsspp
$ git submodule update --init --recursive
$ ./b.sh
$ ./build/PPSSPPSDL
