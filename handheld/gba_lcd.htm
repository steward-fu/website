<h3><a href="../index.htm">掌機</a> - Game Boy Advance - <b>更換高亮度螢幕</b></h3>
<hr size="1"><br>
<p>
原本昏暗的屏<br>
<img src="gba_lcd/1.jpg" class="maxSize"><br><br>

LCD腳位<br>
<img src="gba_lcd/2.jpg" class="maxSize"><br><br>

GBA SP掌機排線多了兩根腳位用來控制背光，不過，GBA SP屏又有分AB型、B型，使用者可以經由排線的疏密來判斷是AB型或B型屏<br>
<img src="gba_lcd/3.jpg" class="maxSize"><br><br>

司徒購買AB型屏以及延伸排線<br>
<img src="gba_lcd/4.jpg" class="maxSize"><br><br>

拆機後<br>
<img src="gba_lcd/5.jpg" class="maxSize"><br><br>

接上排線<br>
<img src="gba_lcd/6.jpg" class="maxSize"><br><br>

焊接背光電源，有兩處可以取得，首先是比較不亮的部位，位於C35電容的左方<br>
<img src="gba_lcd/7.jpg" class="maxSize"><br><br>

焊接完的成果<br>
<img src="gba_lcd/8.jpg" class="maxSize"><br><br>

接著找尋最亮的位置，它位於R12的上方<br>
<img src="gba_lcd/9.jpg" class="maxSize"><br><br>

焊接完的成果<br>
<img src="gba_lcd/10.jpg" class="maxSize"><br><br>

如果螢幕有殘影的現象，可以調整如下位置<br>
<img src="gba_lcd/11.jpg" class="maxSize"><br><br>

需要挖掉邊緣才可以安裝回去<br>
<img src="gba_lcd/12.jpg" class="maxSize"><br><br>

完成<br>
<img src="gba_lcd/13.jpg" class="maxSize"><br><br>

GBA SP(AGS-101)<br>
<img src="gba_lcd/14.jpg" class="maxSize"><br><br>

GBM<br>
<img src="gba_lcd/15.jpg" class="maxSize">
</p>
