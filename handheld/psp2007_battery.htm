<h3><a href="../index.htm">掌機</a> - PSP 2007 - <b>Samsung 3.7V 2500mA電池</b></h3>
<hr size="1"><br>
<p>
拆掉UMD是不需要拆機，只要把UMD背蓋兩邊底部用一字起子輕輕壓開即可<br>
<img src="psp2007_battery/1.jpg" class="maxSize"><br><br>

接著把UMD光碟的四顆螺絲解掉<br>
<img src="psp2007_battery/2.jpg" class="maxSize"><br><br>

UMD光碟機背後有兩條排線，輕輕拔一下就可以拆掉<br>
<img src="psp2007_battery/3.jpg" class="maxSize"><br><br>

拆完的樣子<br>
<img src="psp2007_battery/4.jpg" class="maxSize"><br><br>

電池接點<br>
<img src="psp2007_battery/5.jpg" class="maxSize"><br><br>

從電池內部拉線<br>
<img src="psp2007_battery/6.jpg" class="maxSize"><br><br>

舊款電池<br>
<img src="psp2007_battery/7.jpg" class="maxSize"><br><br>

新款電池<br>
<img src="psp2007_battery/8.jpg" class="maxSize"><br><br>

拉線<br>
<img src="psp2007_battery/9.jpg" class="maxSize"><br>
<img src="psp2007_battery/10.jpg" class="maxSize"><br>
<img src="psp2007_battery/11.jpg" class="maxSize"><br><br>

續航時間<br>
<img src="psp2007_battery/12.jpg" class="maxSize"><br><br>

整線<br>
<img src="psp2007_battery/13.jpg" class="maxSize"><br><br>

接著蓋上背蓋，背蓋旁邊需要剪裁，因為電池的長寬是很剛好的<br>
<img src="psp2007_battery/14.jpg" class="maxSize"><br><br>

最後實際測試可以撐16小時<br>
<img src="psp2007_battery/15.jpg" class="maxSize">
</p>
