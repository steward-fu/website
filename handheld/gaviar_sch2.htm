<h3><a href="../index.htm">掌機</a> - Gaviar (小志掌機) - <b>電路改進</b></h3>
<hr size="1"><br>
<p>
CPU電路<br>
<img src="gaviar_sch2/1.jpg" class="maxSize"><br><br>

充電電路<br>
<img src="gaviar_sch2/2.jpg" class="maxSize"><br><br>

供電電路<br>
<img src="gaviar_sch2/3.jpg" class="maxSize"><br><br>

建議把CTRL拉到GPIO，方便用來控制雜音<br>
<img src="gaviar_sch2/4.jpg" class="maxSize"><br><br>

MicroSD訊號沒有上拉電阻，因此，要注意PCB線長<br>
<img src="gaviar_sch2/5.jpg" class="maxSize"><br><br>

GPIO都拉到獨立GPIO使用，避免鬼鍵問題，不過，可以使用晶片內部的提昇電阻，這樣可以減少電阻拉線<br>
<img src="gaviar_sch2/6.jpg" class="maxSize"><br><br>

背光建議使用IC，避免壓降問題，屏使用RGB-565，建議找有TE(FRAME)的屏，這樣可以有效控制閃屏問題<br>
<img src="gaviar_sch2/7.jpg" class="maxSize">
</p>
