<hr size="1"><br>
<p>
步驟如下：<br>
1. 下載https://github.com/steward-fu/website/releases/download/miyoo-a30/A30spi_burn_20240402.7z<br>
2. 解壓縮後，燒錄到MicroSD<br>
3. 插入MicroSD後，接上USB電源<br>
4. 系統自動開始更新<br>
