<p>

</p>
<pre>
$ export DEVKITPRO=/opt/devkitpro/
$ export DEVKITARM=/opt/devkitpro/devkitARM/

$ cd
$ git clone https://github.com/devkitPro/citro2d
$ cd citro2d
$ make
$ make install
