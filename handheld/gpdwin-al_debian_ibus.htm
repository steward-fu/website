<h3><a href="../index.htm">掌機</a> - GPD Win 上蓋鋁合金版 - Debian 9.0 - <b>如何解決iBus無法修改字型大小的問題</b></h3>
<hr size="1"><br>
<pre>
$ vim ~/.config/gtk-2.0/gtkfilechooser.ini 
    #IBusCandidate *
    {
        font: IPAPGothic 20; 
    }
</pre>
