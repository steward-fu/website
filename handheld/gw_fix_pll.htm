<h3><a href="../index.htm">掌機</a> - Game &amp; Watch: Super Mario Bros. - <b>解決PLL無法設定在280MHz的問題</b></h3>
<hr size="1"><br>
<p>
問題如下：
</p>
<pre>
PLL頻率高於140MHz就會發生死機
</pre><br>

<p>
解法如下：
</p>
<pre>
1. PWR_CR3 LDOEN=1
2. PWR_SRDCR VOS=SCALE0
3. FLASH_ACR LATENCY=7
</pre>
