<hr size="1"><br>
<p>
參考資訊：<br>
https://github.com/Lameguy64/mkpsxiso<br><br>
<p>
<pre>
$ cd
$ git clone https://github.com/Lameguy64/mkpsxiso --recursive
$ mkdir mkpsxiso/build
$ cd mkpsxiso/build
$ cmake ..
$ make -j4
$ sudo make install
</pre>
